name: KOReader plugin

# The plugin is Lua, tested with busted on LuaJIT — what KOReader runs — and shipped as a zip
# of its folder. Only the plugin's own files matter to it, so nothing here runs for a change to
# the services.
on:
  push:
    branches: [master]
    tags: ["plugin-v*"]
    paths: ["readingtracker.koplugin/**", ".github/workflows/koreader-plugin.yml"]
  pull_request:
    paths: ["readingtracker.koplugin/**", ".github/workflows/koreader-plugin.yml"]

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The same image spec/run.sh uses locally, so CI and a developer's machine run one and
      # the same busted on one and the same LuaJIT. (luarocks straight on a runner's LuaJIT
      # trips over its own manifest — "main function has more than 65536 constants".)
      - name: Test
        working-directory: readingtracker.koplugin
        run: sh spec/run.sh

      # Everything a Kindle needs and nothing it does not: no specs, no Docker runner, no
      # reader's own config (gitignored, but excluded again here so a stray copy never ships).
      - name: Package
        run: |
          zip -r readingtracker.koplugin.zip readingtracker.koplugin \
            -x 'readingtracker.koplugin/spec/*' \
               'readingtracker.koplugin/.busted' \
               'readingtracker.koplugin/.gitignore' \
               'readingtracker.koplugin/readingtracker_config.lua'

      - uses: actions/upload-artifact@v4
        with:
          name: readingtracker.koplugin
          path: readingtracker.koplugin.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: readingtracker.koplugin.zip
