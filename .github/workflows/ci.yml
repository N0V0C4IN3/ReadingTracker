name: CI

on:
  # Pushes to master plus every PR. Feature-branch pushes are covered by their PR,
  # so this doesn't run the same commit twice.
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # The full history, so check-web.sh can measure files against where the branch left master.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dropped declarations and the line budget: what the .NET build cannot see.
      - name: Check web frontend
        run: bash tools/check-web.sh

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start their own Postgres via Testcontainers, using the
      # Docker daemon that is already available on GitHub-hosted runners.
      - name: Test
        run: dotnet test --no-build --configuration Release
