# Sent with every page and file of the frontend, never with the Gateway's answers. Included in
# each location rather than set once on the server, because nginx drops the server's add_header
# lines in any location that has one of its own. X-Frame-Options is not here: it differs by route.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
include /etc/nginx/csp.conf;
