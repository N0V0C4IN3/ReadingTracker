# The Pi's front door (ADR-0016). Tailscale Funnel hands every request here; the Gateway's own
# paths go on to it and everything else is the frontend's files.

# Funnel says who the visitor is in X-Forwarded-For, appended after anything the visitor sent, so
# only its last entry, from a container on this machine, is believed. The Gateway is then told
# that address alone, and counts each signed-out visitor separately by it (ReaderPace).
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# Keyed on the address as requested: the fallback to index.html rewrites $uri.
map $request_uri $frame_options {
    # Google answers the hidden sign-in iframe by redirecting back here, inside that iframe.
    ~^/authentication/login-callback(\?|$)  SAMEORIGIN;
    default                                 DENY;
}

map $request_uri $cache_control {
    # Fingerprinted by the publish, so a changed file is a new name.
    ~^/_framework/  "public, max-age=31536000, immutable";
    # The landing page's jackets, which never change under their id.
    ~^/covers/      "public, max-age=604800";
    default         "no-cache";
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Blazor publishes a .br and a .gz beside every file; send those rather than compressing here.
    brotli_static on;
    gzip_static on;

    # Docker's DNS, asked again rather than once at start-up, so a rebuilt Gateway with a new
    # address is found without restarting this.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    # Everything the Gateway answers: the API (the web app and the KOReader plugin) and /health,
    # which funnel-watch and the deploy check probe through here. No frontend headers on these.
    location ~ ^/(api/|health$) {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The frontend. Its locations below set no headers of their own, so they inherit these.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options $frame_options always;
        add_header Cache-Control $cache_control always;
        include /etc/nginx/csp.conf;

        # Files that are missing are a 404, not the app's page in their place.
        location ^~ /_framework/ {
            try_files $uri =404;
        }

        location ~ ^/(_content|css|js|covers)/|\.(png|svg|ico|json|txt|xml|webmanifest)$ {
            try_files $uri =404;
        }

        # Any other path is a page of the app, which routes it itself.
        try_files $uri /index.html;
    }
}
