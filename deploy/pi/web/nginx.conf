# The Pi's front door (ADR-0016). Tailscale Funnel hands every request here; the Gateway's own
# paths go on to it and everything else is the frontend's files.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # Blazor publishes a .gz beside every file; send those rather than compressing on the fly.
    gzip_static on;

    # Docker's DNS, asked again rather than once at start-up, so a rebuilt Gateway with a new
    # address is found without restarting this.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    # Everything the Gateway answers: the API (the web app and the KOReader plugin) and /health,
    # which funnel-watch and the deploy check probe through here.
    location ^~ /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass $gateway;
    }

    # Fingerprinted by the publish, so a changed file is a new name.
    location ^~ /_framework/ {
        include /etc/nginx/headers.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Files that are missing are a 404, not the app's page in their place.
    location ~ ^/(_content|css|js|covers)/|\.(png|svg|ico|json|txt|xml|webmanifest)$ {
        include /etc/nginx/headers.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Google answers the hidden sign-in iframe by redirecting back here, inside that iframe.
    location = /authentication/login-callback {
        include /etc/nginx/headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Any other path is a page of the app, which routes it itself.
    location / {
        include /etc/nginx/headers.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
